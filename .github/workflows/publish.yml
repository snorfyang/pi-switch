name: Publish

# Releases are triggered by pushing a version tag (for example v0.0.2).
# Use `npm version patch && git push --follow-tags`.
#
# Publishing uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed.
# Provenance is generated automatically. One-time setup on npmjs.com:
#   package -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: snorfyang
#     Repository:           pi-switch
#     Workflow filename:    publish.yml
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for OIDC / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache: this is a release build.
      - run: npm ci
      - run: npm test

      - name: Verify the tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish
